name: 每日热点定时推送

on:
  schedule:
    # 每2小时触发一次 (UTC时间，对应北京时间8点、10点、12点...等)
    - cron: '0 */2 * * *'
  workflow_dispatch: # 允许手动触发
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'package.json'

jobs:
  # 调试任务 - 使用 debugger action
  debug:
    name: 调试环境检查
    runs-on: ubuntu-latest
    steps:
    - name: 启动调试会话
      uses: csexton/debugger-action@master

    - name: 检出代码
      uses: actions/checkout@v4

    - name: 调试项目结构
      run: |
        echo "=== 调试信息 ==="
        echo "当前工作目录: $(pwd)"
        echo "用户: $(whoami)"
        echo "Node版本: $(node --version)"
        echo "NPM版本: $(npm --version)"
        echo ""
        echo "=== 项目文件结构 ==="
        find . -type f | head -30
        echo ""
        echo "=== 检查关键文件 ==="
        ls -la scripts/ || echo "scripts目录不存在"
        echo ""
        echo "=== package.json内容 ==="
        cat package.json || echo "package.json不存在"
        echo ""
        echo "=== 环境变量检查 ==="
        echo "COZE_API_TOKEN: ${COZE_API_TOKEN:0:10}..."
        echo "COZE_WORKFLOW_ID: $COZE_WORKFLOW_ID"
        echo "FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:0:30}..."
      env:
        COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
        COZE_WORKFLOW_ID: ${{ secrets.COZE_WORKFLOW_ID }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

    - name: 调试依赖安装
      run: |
        echo "=== 尝试安装依赖 ==="
        npm install --verbose
        echo ""
        echo "=== 检查已安装的依赖 ==="
        npm list --depth=0
        echo ""
        echo "=== 检查node_modules ==="
        ls -la node_modules/ | head -20 || echo "node_modules目录不存在"

    - name: 调试脚本执行
      env:
        COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
        COZE_WORKFLOW_ID: ${{ secrets.COZE_WORKFLOW_ID }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        NODE_ENV: production
      run: |
        echo "=== 脚本执行前检查 ==="
        if [ ! -f "scripts/main.js" ]; then
          echo "错误: scripts/main.js 文件不存在"
          find . -name "*.js" -type f
          exit 1
        fi

        echo "scripts/main.js 存在，内容预览："
        head -20 scripts/main.js
        echo ""

        echo "=== 检查Node.js语法 ==="
        node -c scripts/main.js && echo "语法检查通过" || echo "语法错误"

        if [ -f "scripts/coze_api.js" ]; then
          node -c scripts/coze_api.js && echo "coze_api.js 语法检查通过" || echo "coze_api.js 语法错误"
        fi

        if [ -f "scripts/feishu_push.js" ]; then
          node -c scripts/feishu_push.js && echo "feishu_push.js 语法检查通过" || echo "feishu_push.js 语法错误"
        fi
        echo ""

        echo "=== 尝试执行脚本 ==="
        node scripts/main.js --help

  # 实际执行任务
  fetch-and-push-hot-news:
    name: 执行热点推送
    runs-on: ubuntu-latest
    needs: debug
    if: success()

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Node.js环境
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 安装依赖
      run: |
        echo "安装依赖..."
        npm install
        echo "依赖安装完成"

    - name: 验证环境变量
      run: |
        echo "验证必需的环境变量..."
        REQUIRED_VARS=("COZE_API_TOKEN" "COZE_WORKFLOW_ID" "FEISHU_WEBHOOK_URL")
        MISSING_VARS=()

        for var in "${REQUIRED_VARS[@]}"; do
          if [ -z "${!var}" ]; then
            MISSING_VARS+=("$var")
          else
            echo "$var: 已设置"
          fi
        done

        if [ ${#MISSING_VARS[@]} -ne 0 ]; then
          echo "错误: 缺少必需的环境变量: ${MISSING_VARS[*]}"
          exit 1
        fi

        echo "所有必需的环境变量都已设置"
      env:
        COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
        COZE_WORKFLOW_ID: ${{ secrets.COZE_WORKFLOW_ID }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

    - name: 测试模式执行
      id: test-run
      env:
        COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
        COZE_WORKFLOW_ID: ${{ secrets.COZE_WORKFLOW_ID }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        NODE_ENV: production
      run: |
        echo "运行测试模式..."
        node scripts/main.js --test
        echo "测试模式完成"

    - name: 正式执行
      if: steps.test-run.outcome == 'success'
      env:
        COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
        COZE_WORKFLOW_ID: ${{ secrets.COZE_WORKFLOW_ID }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        NODE_ENV: production
      run: |
        echo "开始正式执行热点推送..."
        node scripts/main.js
        echo "热点推送执行完成"

    - name: 记录执行结果
      if: always()
      run: |
        echo "$(date '+%Y-%m-%d %H:%M:%S'): 工作流执行完成" >> progress.log
        if [ -f "progress.log" ]; then
          echo "=== 执行日志 ==="
          cat progress.log
        else
          echo "没有日志文件"
        fi