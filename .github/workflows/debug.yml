name: 调试工作流

on:
  workflow_dispatch:
    inputs:
      debug_mode:
        description: '调试模式'
        required: true
        default: 'full'
        type: choice
        options:
        - full
        - syntax
        - dependencies
        - environment

jobs:
  debug-action:
    runs-on: ubuntu-latest
    name: 调试 GitHub Action

    steps:
    - name: 启动调试器
      uses: csexton/debugger-action@master

    - name: 检出代码
      uses: actions/checkout@v4

    - name: 基础环境检查
      run: |
        echo "=== 基础环境信息 ==="
        echo "操作系统: $(uname -a)"
        echo "当前用户: $(whoami)"
        echo "工作目录: $(pwd)"
        echo "磁盘空间: $(df -h .)"
        echo "内存使用: $(free -h)"
        echo "Node版本: $(node --version)"
        echo "NPM版本: $(npm --version)"

    - name: 项目结构检查
      run: |
        echo "=== 项目结构 ==="
        echo "完整文件列表:"
        find . -type f -print | sort
        echo ""
        echo "目录结构:"
        tree . || find . -type d | sort

    - name: package.json 检查
      run: |
        echo "=== package.json 检查 ==="
        if [ -f "package.json" ]; then
          echo "package.json 存在，内容如下:"
          cat package.json
          echo ""
          echo "JSON 语法检查:"
          node -e "console.log('JSON 语法正确:', !!JSON.parse(require('fs').readFileSync('package.json', 'utf8')))"
        else
          echo "错误: package.json 不存在"
        fi

    - name: 脚本文件检查
      if: github.event.inputs.debug_mode == 'full' || github.event.inputs.debug_mode == 'syntax'
      run: |
        echo "=== 脚本文件检查 ==="

        for script in scripts/main.js scripts/coze_api.js scripts/feishu_push.js; do
          echo "检查 $script:"
          if [ -f "$script" ]; then
            echo "  ✓ 文件存在"
            echo "  文件大小: $(stat -c%s "$script") 字节"
            echo "  前10行内容:"
            head -10 "$script" | sed 's/^/    /'

            # 语法检查
            if node -c "$script" 2>/dev/null; then
              echo "  ✓ 语法检查通过"
            else
              echo "  ✗ 语法错误:"
              node -c "$script" 2>&1 | sed 's/^/    /'
            fi
          else
            echo "  ✗ 文件不存在"
          fi
          echo ""
        done

    - name: 依赖安装测试
      if: github.event.inputs.debug_mode == 'full' || github.event.inputs.debug_mode == 'dependencies'
      run: |
        echo "=== 依赖安装测试 ==="

        if [ -f "package.json" ]; then
          echo "清理之前的安装..."
          rm -rf node_modules package-lock.json

          echo "执行 npm install..."
          npm install --verbose

          echo "检查安装结果:"
          if [ -d "node_modules" ]; then
            echo "  ✓ node_modules 目录已创建"
            echo "  安装的包:"
            ls -la node_modules/ | head -20
            echo ""
            echo "  npm list --depth=0:"
            npm list --depth=0
          else
            echo "  ✗ node_modules 目录未创建"
          fi
        else
          echo "跳过依赖安装 (package.json 不存在)"
        fi

    - name: 环境变量检查
      if: github.event.inputs.debug_mode == 'full' || github.event.inputs.debug_mode == 'environment'
      run: |
        echo "=== 环境变量检查 ==="

        echo "GitHub 环境变量:"
        echo "  GITHUB_REPOSITORY: $GITHUB_REPOSITORY"
        echo "  GITHUB_REF: $GITHUB_REF"
        echo "  GITHUB_SHA: $GITHUB_SHA"
        echo "  GITHUB_WORKFLOW: $GITHUB_WORKFLOW"
        echo "  GITHUB_ACTION: $GITHUB_ACTION"
        echo ""

        echo "Secrets 检查 (隐藏敏感信息):"
        SECRETS=("COZE_API_TOKEN" "COZE_WORKFLOW_ID" "FEISHU_WEBHOOK_URL")

        for secret in "${SECRETS[@]}"; do
          if [ -n "${!secret}" ]; then
            case $secret in
              "COZE_API_TOKEN")
                echo "  $secret: ${!secret:0:10}... (${#secret} 字符)"
                ;;
              "FEISHU_WEBHOOK_URL")
                echo "  $secret: ${!secret:0:30}... (${#secret} 字符)"
                ;;
              *)
                echo "  $secret: ${!secret}"
                ;;
            esac
          else
            echo "  $secret: [未设置]"
          fi
        done

    - name: 尝试执行脚本 (帮助模式)
      if: github.event.inputs.debug_mode == 'full'
      env:
        COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
        COZE_WORKFLOW_ID: ${{ secrets.COZE_WORKFLOW_ID }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      run: |
        echo "=== 脚本执行测试 ==="

        if [ -f "scripts/main.js" ]; then
          echo "尝试运行 --help 模式:"
          node scripts/main.js --help || echo "帮助模式执行失败"
          echo ""

          echo "尝试运行 --test 模式:"
          node scripts/main.js --test || echo "测试模式执行失败"
        else
          echo "跳过脚本执行 (main.js 不存在)"
        fi

    - name: 网络连接测试
      if: github.event.inputs.debug_mode == 'full'
      run: |
        echo "=== 网络连接测试 ==="

        echo "测试 DNS 解析:"
        nslookup api.coze.cn || echo "DNS 解析失败"
        echo ""

        echo "测试 Coze API 连接:"
        curl -I https://api.coze.cn --connect-timeout 10 || echo "Coze API 连接失败"
        echo ""

        echo "测试飞书域名连接:"
        curl -I https://open.feishu.cn --connect-timeout 10 || echo "飞书域名连接失败"

    - name: 生成调试报告
      if: always()
      run: |
        echo "=== 调试报告生成 ==="

        REPORT_FILE="debug-report-$(date +%Y%m%d-%H%M%S).txt"

        {
          echo "GitHub Action 调试报告"
          echo "======================="
          echo "生成时间: $(date)"
          echo "仓库: $GITHUB_REPOSITORY"
          echo "工作流: $GITHUB_WORKFLOW"
          echo "调试模式: ${{ github.event.inputs.debug_mode }}"
          echo ""

          echo "系统信息:"
          echo "---------"
          uname -a
          echo ""

          echo "Node.js 信息:"
          echo "------------"
          node --version
          npm --version
          echo ""

          echo "项目文件列表:"
          echo "------------"
          find . -type f -name "*.js" -o -name "*.json" -o -name "*.yml" -o -name "*.yaml" | sort
          echo ""

          if [ -f "package.json" ]; then
            echo "Package.json 内容:"
            echo "----------------"
            cat package.json
          fi

        } > "$REPORT_FILE"

        echo "调试报告已生成: $REPORT_FILE"
        echo "报告内容:"
        cat "$REPORT_FILE"

        echo ""
        echo "=== 保存调试结果 ==="
        echo "如果需要保存这些调试信息，可以："
        echo "1. 截图保存终端输出"
        echo "2. 下载此工作流的日志文件"
        echo "3. 将生成的调试报告文件保存为 Artifacts"