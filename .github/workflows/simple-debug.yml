name: 简单调试

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  simple-test:
    runs-on: ubuntu-latest
    name: 简单模块测试

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 检查文件存在性
      run: |
        echo "=== 文件检查 ==="
        echo "当前目录: $(pwd)"
        echo "文件列表:"
        find . -type f | sort

    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 运行模块测试
      run: |
        echo "=== 运行模块加载测试 ==="
        node test-modules.js
      env:
        COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

  test-with-dependencies:
    runs-on: ubuntu-latest
    name: 依赖测试
    needs: simple-test

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 测试 package.json 安装
      run: |
        echo "=== 测试依赖安装 ==="
        if [ -f "package.json" ]; then
          echo "使用现有 package.json 安装依赖"
          npm install
          npm list --depth=0
        else
          echo "没有 package.json，创建基础依赖"
          npm init -y
          npm install # 安装 package.json 中定义的依赖
        fi

    - name: 运行脚本测试
      run: |
        echo "=== 运行脚本测试 ==="
        node test-modules.js
        echo ""
        echo "=== 尝试运行主脚本帮助 ==="
        if [ -f "scripts/main.js" ]; then
          node scripts/main.js --help
        else
          echo "main.js 不存在"
        fi
      env:
        COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
        COZE_WORKFLOW_ID: ${{ secrets.COZE_WORKFLOW_ID }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}

  full-test:
    runs-on: ubuntu-latest
    name: 完整功能测试
    needs: test-with-dependencies
    if: success()

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装 Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: 安装依赖
      run: |
        echo "=== 安装依赖 ==="
        npm install

    - name: 运行测试模式
      run: |
        echo "=== 运行测试模式 ==="
        node scripts/main.js --test
      env:
        COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
        COZE_WORKFLOW_ID: ${{ secrets.COZE_WORKFLOW_ID }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        NODE_ENV: production

    - name: 如果测试成功，运行完整流程
      if: success()
      run: |
        echo "=== 运行完整流程 ==="
        node scripts/main.js
      env:
        COZE_API_TOKEN: ${{ secrets.COZE_API_TOKEN }}
        COZE_WORKFLOW_ID: ${{ secrets.COZE_WORKFLOW_ID }}
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        NODE_ENV: production